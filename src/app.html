<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c1f5c">
<link rel="icon" href="icon-192.png">
<title>Project Reports — P&amp;L and Executive Summary</title>
<style>
:root{
  --navy:#0f2247; --navy2:#1b3566; --ink:#16202f; --muted:#64708a; --line:#dfe4ee;
  --bg:#f3f5f9; --card:#ffffff; --accent:#1f57c3; --soft:#eaf0fb;
  --good:#12805c; --goodbg:#e2f5ec; --bad:#c0392b; --badbg:#fbe6e3; --warn:#a56a00; --warnbg:#fdf1d6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Tahoma,Arial,sans-serif}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:16px;font-weight:700;letter-spacing:.3px}
.brand small{display:block;font-weight:400;font-size:12px;color:#aab8d6;margin-top:2px}
.drop{border:1.5px dashed #5c75a8;border-radius:10px;padding:14px 10px;text-align:center;font-size:12.5px;color:#cfd9ee;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{background:#1b3566;border-color:#9db4e6;color:#fff}
.drop b{display:block;font-size:13.5px;color:#fff;margin-bottom:3px}
.plabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8fa2c9;margin:4px 4px -6px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{border:1px solid transparent;border-radius:9px;padding:9px 10px;cursor:pointer;background:#162d5a}
.pitem:hover{background:#1e3a72}
.pitem.sel{background:#fff;color:var(--ink)}
.pitem .n{font-weight:600;display:flex;align-items:center;gap:7px}
.pitem .s{font-size:12px;color:#a9b8d8;margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.pitem.sel .s{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#8493b3;flex:none}
.dot.good{background:#2fc28a}.dot.bad{background:#ff6b5a}
.tag{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;background:#2b4680;color:#d6e0f5;margin-left:3px}
.tag.off{opacity:.35}
.rm{border:0;background:none;color:inherit;opacity:.45;font-size:17px;line-height:1;padding:0 2px;margin-left:4px;cursor:pointer;border-radius:4px}
.rm:hover{opacity:1;background:#c0392b;color:#fff}
.pitem.sel .tag{background:var(--soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;gap:8px}
.btn{border:1px solid #47609a;background:transparent;color:#dbe4f7;border-radius:7px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{background:#1e3a72}
main{padding:22px 28px 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:24px;margin:0;color:var(--navy)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px}
.tab{padding:9px 18px;font-weight:600;color:var(--muted);cursor:pointer;border:0;background:none;font:inherit;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--navy);border-bottom-color:var(--accent)}
.printbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px 12px;font:inherit;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:20px;font-weight:700;color:var(--navy);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .x{font-size:12px;color:var(--muted);margin-top:1px}
.kpi.good{background:var(--goodbg);border-color:#bfe6d3}.kpi.good .v{color:var(--good)}
.kpi.bad{background:var(--badbg);border-color:#f3c5bf}.kpi.bad .v{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card h3{margin:0;padding:9px 14px;background:var(--navy);color:#fff;font-size:13px;letter-spacing:.4px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 14px;border-bottom:1px solid #edf0f6;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#f7f9fc;font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{font-weight:600}
.neg{color:var(--bad)} .pos{color:var(--good)}
tr.total td{background:var(--soft);font-weight:700}
tr.grp td{background:#f7f9fc;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.badge{display:inline-block;border-radius:20px;padding:2px 10px;font-weight:700;font-size:12px}
.badge.good{background:var(--goodbg);color:var(--good)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.cpi{display:inline-block;min-width:54px;text-align:center;border-radius:5px;padding:1px 6px}
.empty{background:var(--card);border:1px dashed #c3ccdd;border-radius:12px;padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}
.link{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}
.msgs{margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.msg{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.mt{margin-top:14px}
.scroll{overflow-x:auto}
@media (max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto}}
@media print{
  aside,.tabs,.printbtn,.link,.msgs{display:none!important}
  .app{display:block} main{padding:0} body{background:#fff}
  .card,.kpi{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== report sheets (follow the original PDF formatting) ===== */
.sheetwrap{overflow-x:auto;padding-bottom:6px}
.sheet{background:#fff;box-shadow:0 2px 14px rgba(15,34,71,.14);border:1px solid #d5dbe7;margin:0 auto;color:#000}
.sheet td,.sheet th{border-bottom:0;padding:0;vertical-align:middle;background:none;text-transform:none;letter-spacing:0;color:inherit;font-size:inherit}
.r{text-align:right}
/* P&L */
.sheet.pl{width:800px;max-width:100%;padding:36px 62px 50px}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 -40px 44px;font-family:Arial,Helvetica,sans-serif}
.shead .co{font-size:11px;font-weight:700;line-height:1.35}
.shead .ttl{font-size:19px;font-weight:700}
.logo{justify-self:end}
.logo img{height:64px;display:block}
.logo b{display:block;font-size:13px;letter-spacing:1px;margin-top:2px}
.logo small{display:block;font-size:6.5px;letter-spacing:1px;color:#555;margin-top:2px}
.plt{border:2px solid #000;font-family:"Times New Roman",Times,serif;font-size:15px;table-layout:fixed}
.sheet .plt td{border:1px solid #000;padding:1px 3px;font-weight:700;line-height:1.18;background:#fff}
.sheet .plt td.v{text-align:center;font-weight:400;background:#f2f2f2}
.sheet .plt tr.hdr td{background:#0c1f5c;color:#fff;font-size:16px;padding:5px 3px;border-color:#000}
.sheet .plt tr.hdr td.v{font-weight:700}
.sheet .plt tr.big td{font-size:16px;padding:6px 3px;background:#f2f2f2}
.sheet .plt tr.big td.v{font-weight:700}
.sheet .plt tr.vb td.v{color:#1b4aa0;font-weight:700}
.sheet .plt tr.vl td.v{color:#1b4aa0}
.sheet .plt tr.vk td.v{font-weight:700}
.sheet .plt tr.yl td.v{background:#fff2cc}
.sheet .plt tr.gr td.v{background:#a9e3b4}
.sheet .plt tr.top td{border-top:3px solid #000}
.plt2{margin-top:18px}
.sheet .plt tr.st td.v{color:#fff;font-weight:400}
.sheet .plt tr.st.bad td.v{background:#d0432a}
.sheet .plt tr.st.good td.v{background:#2e9e5b}
.sheet .plt tr.st.warn td.v{background:#d99a1c}
/* Executive summary */
.sheet.ex{width:1240px;padding:26px 60px 34px;font-family:Arial,Helvetica,sans-serif;font-size:11.5px}
.rule2{height:2px;background:linear-gradient(90deg,#000 0 32%,transparent 32% 46%,#000 46%);margin-bottom:12px}
.rule1{height:1.5px;background:#000;margin:14px 0 22px}
.gtitle{display:inline-block;min-width:180px;border-bottom:1px solid #000;padding-bottom:3px;margin-bottom:8px}
.gtitle.lg{min-width:0;margin:7px 0 6px}
.bar{height:6px;background:#b4c7e7;margin:2px 0}
.gi{margin:6px 0;table-layout:fixed}
.sheet .gi td{padding:5px 0;height:20px}
.sheet .gi td.u{border-bottom:1px solid #000;text-align:right}
.sheet .gi td:nth-child(3),.sheet .gi td:nth-child(5),.sheet .gi td:nth-child(7){padding-left:20px}
.sheet .gi tr:not(:first-child) td:nth-child(6){padding-left:20px}
.gi .pn{vertical-align:top!important;padding-left:20px!important}
.m{display:flex;justify-content:space-between;gap:10px}
.m i{font-style:normal}
.two{display:grid;grid-template-columns:46% 1fr;gap:22px;margin-top:8px}
.sec{border-collapse:collapse;width:100%;table-layout:fixed}
.two>*{min-width:0}
.sheet .sec td.val,.sheet .sec th.bx{padding-left:18px}
.sheet .sec td:first-child,.sheet .sec th.st{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .sec th.st{text-align:left;font-weight:700}
.sheet .sec .box,.sheet .dvt tr.dh th{background:#adb9ca;border:1.5px solid #1f2a44;text-align:center;font-weight:400;padding:1px 4px}
.sheet .sec td{padding-top:2px;vertical-align:bottom}
.sheet .sec td:first-child{padding-bottom:3px}
.f,.f0{height:8px;line-height:8px;font-size:6.5px;text-align:center;color:#fff}
.f{background:#8497b0}
.uu{border-bottom:1px solid #000;text-align:right;padding:3px 0 2px;min-height:19px}
.dvt{border-collapse:separate;border-spacing:18px 0;margin:0 -18px;width:calc(100% + 36px);table-layout:fixed}
.sheet .dvt tr.dh th{font-weight:700;font-size:12px;padding:9px 4px;border-width:2px}
.sheet .dvt td{padding-top:1px;vertical-align:bottom}
.dn{border-bottom:1px solid #000!important;padding:4px 0 3px!important;white-space:normal;overflow-wrap:anywhere}
.dc{display:inline-block;width:26px;margin-left:-22px;margin-right:4px;text-align:right}
.dvt .dn{padding-left:22px!important}
.dd{border-bottom:1px solid #000;padding:4px 0 3px}
.sheet .dvt tr.dt td{padding-top:12px}
.dvt tr.dt .dn,.dvt tr.dt .dd{border:2px solid #1f2a44!important;background:#adb9ca;font-weight:700;font-size:12px;padding:3px 6px!important}
.dvt tr.dt .dn{padding-left:8px!important}
.sheet .dvt tr.gap td{padding-top:14px}
.dvt tr.gap .dn{position:relative}
.bot{display:grid;grid-template-columns:61% 1fr;gap:26px;margin:8px 0;align-items:center}
.bt{table-layout:fixed}
.sheet .bt td{padding:5px 0;font-weight:700}
.sheet .bt td:first-child{width:28%;padding-right:10px}
.sheet .bt.b2 td:first-child{width:45%}
.red{color:#c00000}
.sheet .bt td.u2{border-bottom:1px solid #000}
.sheet .leg td{padding:5px 0}
.sheet .leg td:nth-child(1){width:17%}.sheet .leg td:nth-child(2){width:46%}.sheet .leg td:nth-child(3){width:17%}
@media print{
  .sheet{box-shadow:none;border:0;margin:0}
  .sheetwrap{overflow:visible;padding:0}
  main{padding:0!important}
  .head{display:none!important}
}
/* compact executive sheet so it keeps the A3 landscape proportion */
.sheet.ex{line-height:1.15;padding:22px 56px 24px}
.sheet.ex .gi td{padding-top:3px;padding-bottom:3px;height:auto}
.sheet.ex .uu{padding:2px 0 1px;min-height:16px}
.sheet.ex .f,.sheet.ex .f0{height:7px;line-height:7px}
.sheet.ex .sec td{padding-top:1px}
.sheet.ex .two{margin-top:5px}
.sheet.ex .rule1{margin:8px 0 10px}
.sheet.ex .dn,.sheet.ex .dd{padding-top:2px!important;padding-bottom:1px!important}
.sheet.ex .dvt tr.dh th{padding:7px 4px}
.sheet.ex .dvt tr.dt td{padding-top:7px}
.sheet.ex .dvt tr.gap td{padding-top:9px}
.sheet.ex .bot{margin:4px 0}
.sheet.ex .bt td{padding:3px 0}
.sheet.ex .leg td{padding:3px 0}
.sheet.ex .gtitle{margin-bottom:5px}
.sheet.ex .gtitle.lg{margin:4px 0 3px}
/* ===== top bar layout ===== */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--navy);color:#fff;padding:9px 20px;box-shadow:0 2px 10px rgba(15,34,71,.25)}
.topbar .brand .ver{font-size:11px;font-weight:600;color:#aab8d6;margin-left:6px;padding:2px 6px;border:1px solid #3a5185;border-radius:10px;letter-spacing:0;vertical-align:2px}
@media print{.ver{display:none}}
.topbar .brand{font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.psel{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8fa2c9}
.psel select{min-width:230px;max-width:46vw;font:inherit;font-size:14.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--navy);background:#fff;border:0;border-radius:7px;padding:7px 10px;cursor:pointer}
.psel select:disabled{opacity:.6;cursor:default}
.ttabs{display:flex;gap:4px;background:#162d5a;border-radius:9px;padding:3px}
.topbar .tab{padding:6px 14px;border:0;border-radius:7px;margin:0;color:#b9c6e2;font-size:13.5px}
.topbar .tab:hover{color:#fff}
.topbar .tab.on{background:#fff;color:var(--navy)}
.pmeta{font-size:12.5px;color:#b9c6e2;display:flex;align-items:center;gap:8px;white-space:nowrap}
.grow{flex:1}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid #47609a;border-radius:8px;background:transparent;color:#dbe4f7;cursor:pointer}
.ibtn:hover{background:#1e3a72;color:#fff}
body.editing #edit{background:#fff;color:var(--navy);border-color:#fff}
main{padding:22px 24px 60px}
aside{position:fixed;top:0;right:0;left:auto;width:330px;max-width:92vw;height:100vh;z-index:40;transform:translateX(105%);transition:transform .2s ease;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
body.editing aside{transform:none}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,20,45,.4);display:none}
body.editing .scrim{display:block}
.phead{display:flex;align-items:center;justify-content:space-between;font-size:15px}
.pclose{border:0;background:none;color:#cfd9ee;font-size:24px;line-height:1;cursor:pointer;padding:0 4px;border-radius:5px}
.pclose:hover{background:#1e3a72;color:#fff}
.addbtn{margin-top:16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:9px 18px;cursor:pointer}
.addbtn:hover{background:#1949a6}
body.dragging main{outline:3px dashed var(--accent);outline-offset:-10px}
@media (max-width:800px){aside{position:fixed;height:100vh}.pmeta{display:none}}
@media print{.topbar,.scrim{display:none!important}}
/* ===== print: P&L fills A4 portrait, Executive fills A3 landscape ===== */
.sheet.pl.pm{width:800px;max-width:none;padding:14px 26px 18px}
.sheet.pl.pm .shead{margin:0 0 26px}
.sheet.ex.pm{width:var(--pw,1240px)}
@media print{
  .sheet.ex{width:var(--pw,1240px)}
  html,body{height:auto!important;background:#fff!important}
  main{padding:8mm!important}
  .sheetwrap{overflow:visible!important;padding:0!important}
  .sheet{zoom:var(--pz,1);margin:0 auto!important;border:0!important;box-shadow:none!important}
  .sheet.pl{width:800px;max-width:none;padding:14px 26px 18px}
  .sheet.pl .shead{margin:0 0 26px}
}
/* ===== portfolio sheet ===== */
.sheet.pf{width:max-content;padding:20px 24px 18px;font-family:"Segoe UI",Arial,sans-serif;color:#1d2433}
.pfhead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #0c1f5c;padding-bottom:12px}
.pfhead .co{font-size:14px;color:#5b6577}.pfhead .ttl{font-size:26px;font-weight:700;color:#0c1f5c;margin:0;text-align:left}
.pfr{display:flex;align-items:flex-end;gap:26px}.pfr .logo{position:static;margin:0}.pfr .logo img{height:60px;width:auto}
.pfhead .pfdate{font-size:15px;color:#5b6577;text-align:right;line-height:1.35}.pfhead .pfdate b{color:#0c1f5c;font-size:17px}
.pfk{width:0;min-width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0}
.kc{border:1px solid #e1e5ec;border-left:5px solid #0c1f5c;border-radius:8px;padding:8px 12px;background:#fafbfc}
.kc .l{font-size:13px;color:#5b6577;text-transform:uppercase;letter-spacing:.5px;font-weight:600}.kc .kv{font-size:22px;font-weight:700;color:#0c1f5c;margin-top:2px}
.kc .s{font-size:13px;color:#5b6577}.kc.good{border-left-color:#2e7d32}.kc.bad{border-left-color:#c62828}.kc.bad .kv,.kc .kv .negv{color:#c62828}
.sheet.pf .pft{border-collapse:collapse;font-size:15.5px;table-layout:auto;width:100%}
.sheet.pf .pft td,.sheet.pf .pft th{border:0;border-bottom:1px solid #e3e6ec;padding:7px 5px;line-height:1.2;white-space:nowrap}
.sheet.pf .pft td{vertical-align:middle}
.sheet.pf .pft td.pg{padding-top:2px}
.sheet.pf .pft td.pn,.sheet.pf .pft td.cl{white-space:normal;max-width:118px;min-width:70px}
.sheet.pf .pft tr.hd th{background:#2f4a8a;color:#fff;font-weight:600;text-align:center;vertical-align:middle;font-size:14px;padding:6px 5px;border-left:1px solid #ffffff40;border-bottom:0}
.sheet.pf .pft tr.grp th{background:#0c1f5c;text-transform:uppercase;letter-spacing:.5px;font-size:12px;border-left:2px solid #fff}
.sheet.pf .pft td{background:#fff}
.sheet.pf .pft td.v{text-align:right;font-variant-numeric:tabular-nums}
.sheet.pf .pft td.c{text-align:center}
.sheet.pf .pft td.pn{font-weight:700;color:#0c1f5c}.sheet.pf .pft td.cl{color:#5b6577}
.sheet.pf .pft td.b{font-weight:700}
.sheet.pf .pft td.neg,.sheet.pf .pft .negv{color:#c62828}
.sheet.pf .pft td.sep,.sheet.pf .pft th.sep{border-left:2px solid #c9d0dc}.sheet.pf .pft tr.grp th.sep{border-left:2px solid #fff}
.sheet.pf .pft tr[data-k]:nth-child(even) td{background:#f4f5f7}
.sheet.pf .pft td.st{text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:13px;font-weight:700;background:#fff1d6;color:#8a5a00}
td.st.bad .pill{background:#fde3e3;color:#b71c1c}td.st.good .pill{background:#dff3e4;color:#1b6e2f}
.chip{display:inline-block;min-width:44px;padding:2px 6px;border-radius:5px;font-weight:700}
.chip.bad{background:#fde3e3;color:#b71c1c}.chip.warn{background:#fff1d6;color:#8a5a00}.chip.good{background:#dff3e4;color:#1b6e2f}
.sheet.pf .pft td.pg{position:relative;width:120px;min-width:120px;padding-bottom:12px}
.sheet.pf .pft td.pg i{position:absolute;left:8px;right:8px;bottom:6px;height:6px;border-radius:3px;background:linear-gradient(90deg,#5b7fc4 var(--pg),#e3e8f1 var(--pg))}
.sheet.pf .pft tr[data-k]{cursor:pointer}
.sheet.pf .pft tr[data-k]:hover td{background:#e9eef7}
.sheet.pf .pft tr.tot td{background:#e8ecf3;font-weight:700;border-top:2px solid #0c1f5c;border-bottom:2px solid #0c1f5c;font-size:16px;color:#0c1f5c}
.sheet .pflegend{width:0;min-width:100%;line-height:1.5;margin-top:10px;font-size:13.5px;color:#3b4456}.pflegend b{color:#0c1f5c}
.pfnote{width:0;min-width:100%;font-size:11.5px;color:#5b6577;margin-top:8px;line-height:1.4}
@media screen{.sheet.pf{zoom:var(--sz,1);margin:0 auto}}

<script>
"use strict";
const KEY = "projectReports.v1";
let state = { pl:{}, ex:{}, sel:null, tab:"pl" };
let messages = [];
{
  let emb = null, ls = null;
  try { const t = document.getElementById("embedded").textContent.trim(); if (t) emb = JSON.parse(t); } catch(e){}
  try { ls = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (emb && emb.pl && emb.ex && !(ls && ls.snap === emb.snap)) state = emb;
  else if (ls && ls.pl && ls.ex) state = ls;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function num(s){
  if (s == null) return NaN;
  let t = String(s).trim(); if (t === "-" || t === "–") return 0;
  const neg = /^\(.*\)/.test(t) || /^-/.test(t);
  t = t.replace(/[^0-9.]/g,""); if (!t) return NaN;
  const v = parseFloat(t); return neg ? -v : v;
}
const isNeg = s => { const v = num(s); return !isNaN(v) && v < 0; };
const VALUE_RE = /^\(?-?[\d,]*\.?\d+\)?\s*(%|M|m3|m2|ton|kg\/m3|m3\/m2)?$/i;
const isValue = s => VALUE_RE.test(s) || /^[A-Za-z]{3}-\d{2}$/.test(s) || /^[-–]$/.test(s);
const isNoise = s => !/\s/.test(s) && !isValue(s) && /^[()A-Za-z0-9.\/*]+$/.test(s) && /[\/()]/.test(s) && s.length <= 18;

/* ---------- PDF text extraction ---------- */
async function extractItems(buf){
  const doc = await pdfjsLib.getDocument({ data:new Uint8Array(buf), useWorkerFetch:false, isEvalSupported:false }).promise;
  const items = [];
  for (let p = 1; p <= doc.numPages; p++){
    const page = await doc.getPage(p);
    const vp = page.getViewport({ scale:1 });
    const tc = await page.getTextContent();
    for (const it of tc.items){
      const s = (it.str||"").replace(/\s+/g," ").trim(); if (!s) continue;
      const [x, y] = pdfjsLib.Util.transform(vp.transform, it.transform).slice(4);
      items.push({ s, x, y: y + (p-1)*5000, w: it.width || 0 });
    }
  }
  return items;
}
function toRows(items, tol){
  const sorted = [...items].sort((a,b) => a.y - b.y || a.x - b.x);
  const rows = []; let cur = null;
  for (const it of sorted){
    if (!cur || it.y - cur.y > tol){ cur = { y: it.y, items: [] }; rows.push(cur); }
    cur.items.push(it);
  }
  rows.forEach(r => r.items.sort((a,b) => a.x - b.x));
  return rows;
}

/* ---------- P&L parser ---------- */
function parsePL(items){
  const rows = [];
  let started = false;
  for (const r of toRows(items, 4)){
    const its = r.items; if (its.length < 2) continue;
    let gi = -1, gmax = 12;
    for (let i = 0; i < its.length-1; i++){
      const g = its[i+1].x - (its[i].x + its[i].w);
      if (g > gmax){ gmax = g; gi = i; }
    }
    if (gi < 0) continue;
    const label = its.slice(0, gi+1).map(i => i.s).join(" ");
    const value = its.slice(gi+1).map(i => i.s).join(" ");
    if (/^report date/i.test(label)) started = true;
    if (started) rows.push({ label, value });
  }
  const get = re => (rows.find(r => re.test(r.label)) || {}).value || "";
  return { name: get(/^project name/i), client: get(/^client/i), date: get(/^report date/i), rows };
}
const plGet = (pl, re) => (pl.rows.find(r => re.test(r.label)) || {}).value || "";

/* ---------- Executive Summary parser ---------- */
function parseEX(rawItems){
  const items = rawItems.map(i => ({...i, s: i.s.replace(/\bEGP\b/g,"").replace(/\s+/g," ").trim()}))
                        .filter(i => i.s && !isNoise(i.s));
  // stop at the legend
  const legend = items.find(i => /^legend$/i.test(i.s));
  const body = legend ? items.filter(i => i.y < legend.y - 2) : items;

  // row -> segments {label, values[]}
  const segs = [];
  for (const r of toRows(body, 3.5)){
    const its = r.items.slice();
    if (its.length > 1 && /^\d{2,4}$/.test(its[0].s) && !isValue(its[1].s)){
      its.splice(0, 2, {...its[0], s: its[0].s + " " + its[1].s, w: its[1].x + its[1].w - its[0].x});
    }
    let cur = null, prev = null;
    for (const it of its){
      if (isValue(it.s)){ if (cur) cur.values.push(it.s); }
      else if (cur && !cur.values.length && prev && it.x - (prev.x + prev.w) < 5){ cur.label += " " + it.s; }
      else { cur = { label: it.s, values: [], y: r.y, first: it === its[0] }; segs.push(cur); }
      prev = it;
    }
  }
  const find = re => segs.find(s => re.test(s.label) && s.values.length) || segs.find(s => re.test(s.label));
  const vals = re => (find(re) || {}).values || [];

  // position-based lookup: values to the right of a label within a vertical band
  const labelItems = body.filter(i => !isValue(i.s));
  function right(re, tol){
    const lab = body.find(i => re.test(i.s)); if (!lab) return [];
    const band = body.filter(i => Math.abs(i.y - lab.y) <= tol && i.x > lab.x + 1).sort((a,b) => a.x - b.x);
    const out = [];
    for (const it of band){ if (isValue(it.s)) out.push(it.s); else if (labelItems.includes(it) && it.x > lab.x + lab.w) { if (out.length) break; else if (Math.abs(it.y-lab.y) <= 3.5) break; } }
    return out;
  }

  // project name: text after the colon, or the item just below the label
  let name = "";
  const pn = body.find(i => /^project name/i.test(i.s));
  if (pn){
    name = pn.s.replace(/^project name\s*:?\s*/i, "");
    if (!name){
      const below = body.filter(i => i !== pn && i.y > pn.y && i.y - pn.y < 28 && Math.abs(i.x - pn.x) < 12 && !isValue(i.s))
                        .sort((a,b) => a.y - b.y)[0];
      if (below) name = below.s;
    }
  }
  const ct = segs.find(s => /^contract type/i.test(s.label));
  const info = [
    ["Contract Date", vals(/^contract date/i)[0]],
    ["Contract Completion Date", vals(/^contract completion date/i)[0]],
    ["Expected Completion Date", vals(/^expected completion date/i)[0]],
    ["Report Data Date", vals(/^report data date/i)[0]],
    ["Contract Period", vals(/^contract period/i)[0]],
    ["Months Elapsed", vals(/^no\.? of month/i)[0]],
    ["Time Elapsed", vals(/^time elapsed/i)[0]],
    ["Contract Type", ct ? ct.label.replace(/^contract type\s*:?\s*/i,"") : ""],
    ["Total Cost To Complete", vals(/^total cost to complete/i)[0]],
    ["Expected Profitability", vals(/^expected profitability/i)[0]],
  ];
  const tbl = (defs) => defs.map(([label, re]) => ({ label, values: vals(re) })).filter(r => r.values.length);
  const ratios = tbl([
    ["Project % of Budgeted Cost", /^project % of budgeted cost/i],
    ["Div.01 % of Budgeted Cost", /^div\.? ?01 % of budgeted cost/i],
    ["Budgeted Cost / m3", /^budgeted cost ?\/ ?m3/i],
    ["Budgeted Ratio kg/m3", /^budgeted ratio kg/i],
    ["Budgeted Ratio m3/m2", /^budgeted ratio m3/i]]);
  const consumption = tbl([
    ["Total Budgeted Cost", /^total budgeted cost/i],
    ["Div.01 Budget", /^div\.? ?01 budget/i],
    ["Total Concrete (m3)", /^total conc/i],
    ["Total Rebar (ton)", /^total rebar/i],
    ["Total Built-up Area (m2)", /^total built/i]]);
  const progress = tbl([
    ["Based on Program of Work", /^based on program/i],
    ["Based on Payment Certificate", /^based on payment/i]]);
  const div01 = tbl([
    ["Cost per Month", /^cost per month/i],
    ["Remaining Budget / Cost", /^remain\w* budget/i]]);

  // divisions table
  const total = segs.find(s => /^total$/i.test(s.label) && s.values.length >= 4);
  const indirect = [], direct = [];
  const eacLab = body.find(i => /^total eac/i.test(i.s));
  const divHdr = body.find(i => /^divisions$/i.test(i.s));
  const gMark = rawItems.find(i => i.s === "(G)");
  const top = total ? total.y : (divHdr ? divHdr.y : Infinity);
  const drows = segs.filter(s => s !== total && s.first && s.values.length >= 4 && s.y > top && (!eacLab || s.y < eacLab.y - 2));
  let splitY = gMark ? gMark.y : null;
  if (splitY == null && drows.length > 2){
    let gi = -1, gmax = 0, gmin = Infinity;
    for (let i = 1; i < drows.length; i++){ const g = drows[i].y - drows[i-1].y; if (g > gmax){ gmax = g; gi = i; } gmin = Math.min(gmin, g); }
    if (gmax > gmin * 1.5) splitY = drows[gi].y - 1;
  }
  for (const s of drows){
    const m = s.label.match(/^(\d{2,4})\s+(.+)$/);
    (splitY != null && s.y > splitY ? direct : indirect).push({ code: m ? m[1] : "", name: m ? m[2] : s.label, values: s.values });
  }
  const risk = right(/^(risk(\s+contingency.*)?|contingency)$/i, 3.5), gp = right(/^gross profit$/i, 3.5);
  const bottom = {
    eac: right(/^total eac/i, 3.5)[0] || "",
    selling: right(/^total selling price/i, 9)[0] || "",
    riskPct: risk[0] || "", risk: risk[1] || "",
    gpPct: gp[0] || "", gp: gp[1] || "",
    claims: right(/^applied claims/i, 3.5)[0] || "",
    vac: right(/^vac$/i, 3.5)[0] || "",
    ecpi: right(/^ecpi$/i, 3.5)[0] || "",
  };
  return { name, info, ratios, consumption, progress, div01, total: total ? total.values : [], indirect, direct, bottom };
}

/* ---------- loading ---------- */
async function loadBuffers(files){
  messages = [];
  for (const f of files){
    try {
      const items = await extractItems(f.buf);
      const text = items.map(i => i.s).join(" ");
      if (/Project P&L Report/i.test(text) || /EAC Gross Profit/i.test(text)){
        const pl = parsePL(items);
        if (!pl.name) throw new Error("could not find the Project Name");
        pl.file = f.name; state.pl[pl.name] = pl; state.sel = pl.name;
      } else if (/BCWP/.test(text) && /Divisions/i.test(text)){
        const ex = parseEX(items);
        if (!ex.name) ex.name = f.name.replace(/\.pdf$/i,"");
        ex.file = f.name; ex.link = (state.ex[ex.name] || {}).link || null;
        state.ex[ex.name] = ex;
        const p = projects().find(p => p.ex === ex); if (p) state.sel = p.key;
      } else throw new Error("not recognised as a P&L or Executive Summary report");
    } catch(e){ messages.push(`${f.name}: ${e.message || e}`); }
  }
  save(); render();
}
window.loadBuffers = loadBuffers;
async function loadFiles(list){
  const files = [];
  for (const f of list) if (/\.pdf$/i.test(f.name)) files.push({ name: f.name, buf: await f.arrayBuffer() });
  if (files.length) await loadBuffers(files);
}

/* ---------- matching the two reports ---------- */
function autoMatch(ex){
  const sp = num(ex.bottom.selling);
  const names = Object.keys(state.pl);
  if (!isNaN(sp) && sp > 0){
    const hit = names.filter(n => Math.abs(num(plGet(state.pl[n], /^estimated current project value without vat/i)) - sp) < 2);
    if (hit.length === 1) return hit[0];
  }
  const en = norm(ex.name);
  return names.find(n => { const pn = norm(n); return pn && en && (pn === en || pn.includes(en) || en.includes(pn)); }) || null;
}
function projects(){
  const list = Object.keys(state.pl).map(n => ({ key: n, name: n, pl: state.pl[n], ex: null }));
  const extra = [];
  for (const ex of Object.values(state.ex)){
    let target = ex.link === "none" ? null : (ex.link && state.pl[ex.link] ? ex.link : autoMatch(ex));
    const p = target && list.find(p => p.key === target);
    if (p && !p.ex) p.ex = ex; else extra.push({ key: "ex:" + ex.name, name: ex.name, pl: null, ex });
  }
  return list.concat(extra).sort((a,b) => a.name.localeCompare(b.name));
}

function renderCK(ps){

      ["BAC", bd == null && bi == null ? null : (bd || 0) + (bi || 0), n(t[0]), "Current Budget Direct + In-Direct vs Total BAC (A)"],

      const ok = d != null && Math.abs(d) <= (pc ? 0.01 : 1);

        if (f.includes("%")) return (v * 100).toFixed((f.split(".")[1] || "").replace(/[^0]/g, "").length) + "%" + (v < 0 ? "()" : "");
        const d = f.includes(".") ? (f.split(".")[1] || "").replace(/[^0]/g, "").length / 2 : 0;
        return Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) + (v < 0 ? "()" : ""); }
      return String(v.richText ? v.richText.map(x => x.text).join("") : v); };
    for (let rr = start; rr < r; rr++) for (let cc = 1; cc <= ncol; cc++){
      const c = ws.getCell(rr, cc); if (c.isMerged && c.master.address !== c.address) continue;
      if (c.isMerged) continue; // merged cells are ignored by AutoFit
      cx.font = (c.font && c.font.bold ? "bold " : "") + ((c.font && c.font.size) || 11) * 96 / 72 + "px " + ((c.font && c.font.name) || "Calibri");
      const px = Math.max(...shown(c).split("\n").map(t => cx.measureText(t).width));
      fit[cc - 1] = Math.max(fit[cc - 1], px);
    }
    fit.forEach((px, i) => ws.getColumn(i + 1).width = Math.max(4, Math.round((px + 14) / 7 * 100) / 100));
    if (pgCells.length) ws.getColumn(pgCells[0].replace(/\d+/, "")).width = 20.71; // Progress: 150 px
  }
  ws.pageSetup.printTitlesRow = start + ":" + (start + Math.max(nHd, 1) - 1);
  if (pgCells.length){
    const c0 = pgCells[0].replace(/\d+/, ""), rs = pgCells.map(a => +a.replace(/\D+/, ""));
    ws.addConditionalFormatting({ ref: c0 + Math.min(...rs) + ":" + c0 + Math.max(...rs),
      rules: [{ type: "dataBar", priority: 1, gradient: false, minLength: 0, maxLength: 100, showValue: true,
        cfvo: [{ type: "num", value: 0 }, { type: "num", value: 1 }], color: { argb: "FF7FA6DC" } }] });
  }
  const unit = sheet.querySelector(".pfunit");
  if (unit){ const uc = ws.getCell(5, ncol); uc.value = "Amounts in EGP"; uc.font = { name: TNR, size: 11, bold: true, italic: true }; uc.alignment = { horizontal: "right" }; }
  const leg = sheet.querySelector(".pflegend");
  if (leg){
    r++; ws.mergeCells(r, 1, r, ncol);
    Object.assign(ws.getCell(r, 1), { value: leg.innerText.trim(), font: { name: "Arial", size: 10, bold: true, color: { argb: "FF0C1F5C" } }, alignment: { wrapText: true, vertical: "middle" } });
    ws.getRow(r).height = 30;
  }
  const note = sheet.querySelector(".pfnote");
  if (note){
    r++; ws.mergeCells(r, 1, r, ncol);
    const t = note.innerText.trim(), tot = widths.reduce((a, b) => a + Math.min(b, 34), 0);
    Object.assign(ws.getCell(r, 1), { value: t, font: { name: "Arial", size: 9, color: { argb: "FF444444" } }, alignment: { wrapText: true, vertical: "top" } });
    ws.getRow(r).height = Math.max(1, t.split("\n").reduce((a, s) => a + Math.ceil(s.length / (tot * 1.15)), 0)) * 13 + 4;
  }
  ws.pageSetup.printArea = "A1:" + ws.getColumn(ncol).letter + r;
  const buf = await wb.xlsx.writeBuffer();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = document.title + ".xlsx"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  window.__lastXlsx = buf;
}
$("main").addEventListener("change", e => {
  if (e.target.id !== "linksel") return;
  const p = projects().find(p => p.key === state.sel); if (!p || !p.ex) return;
  p.ex.link = e.target.value; save();
  const np = projects().find(q => q.ex === p.ex); if (np) state.sel = np.key;
  render();
});
const drop = $("drop"), file = $("file");
drop.addEventListener("click", () => file.click());
file.addEventListener("change", () => { loadFiles(file.files); file.value = ""; });
["dragover","dragenter"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); document.body.classList.add("dragging"); }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); if (ev === "drop" || !e.relatedTarget) document.body.classList.remove("dragging"); }));
document.addEventListener("drop", e => loadFiles(e.dataTransfer.files));
$("clear").addEventListener("click", () => { if (confirm("Remove all loaded reports from this page?")){ state = { pl:{}, ex:{}, sel:null, tab:"pl", snap: state.snap }; messages = []; save(); render(); } });
render();
</script>
<script>
/* installable app (Chrome / Edge): offline cache, and open PDFs with the app */
if (location.protocol === "https:" && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if ("launchQueue" in window) launchQueue.setConsumer(async p => {
  if (!p.files || !p.files.length) return;
  const files = [];
  for (const h of p.files){ const f = await h.getFile(); files.push({ name: f.name, buf: await f.arrayBuffer() }); }
  if (files.length) loadBuffers(files);
});
</script>
